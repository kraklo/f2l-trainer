<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAN cube spike</title>
    <style>
      :root { color-scheme: dark; --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8ee; --muted: #8b93a7; --good: #4ade80; --bad: #f87171; --accent: #60a5fa; }
      body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      h2 { font-size: 15px; margin: 16px 0 6px; }
      button { font: inherit; padding: 6px 12px; margin: 0 6px 6px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
      button.primary { background: var(--accent); color: #0b1020; border-color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: default; }
      .status { margin-bottom: 12px; line-height: 1.6; }
      .main { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
      .view .cube-view { width: 320px; height: 320px; }
      .scramble .next { font-size: 26px; font-weight: 600; margin: 8px 0; }
      .muted { color: var(--muted); }
      .good { color: var(--good); }
      .bad { color: var(--bad); }
      .log { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; max-height: 360px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
      @media (max-width: 700px) { .main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./spike.ts"></script>
  </body>
</html>
